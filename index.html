<script type="module">
import * as THREE from 'three';
import {EffectComposer} from './lib/addons/postprocessing/EffectComposer.js';
import {RenderPass} from './lib/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from './lib/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from './lib/addons/postprocessing/OutputPass.js';
import {ShaderPass} from './lib/addons/postprocessing/ShaderPass.js';
import {GTAOPass} from './lib/addons/postprocessing/GTAOPass.js';
import {SimplexNoise} from './lib/addons/math/SimplexNoise.js';
/* ============================================================
   TURBO KART GP  —  three.js で描くオリジナルのカートレース
   ============================================================ */
const $=id=>document.getElementById(id);
const TAU=Math.PI*2,clamp=(v,a,b)=>v<a?a:v>b?b:v,rnd=(a,b)=>a+Math.random()*(b-a),lerp=(a,b,t)=>a+(b-a)*t,sstep=t=>t*t*(3-2*t);
const angDiff=(a,b)=>{let d=(a-b)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return d;};
const TOUCH=('ontouchstart' in window)||navigator.maxTouchPoints>0;
const store={get(k,d){try{const v=localStorage.getItem('tkgp_'+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem('tkgp_'+k,JSON.stringify(v));}catch(e){}}};

/* ---------------- レンダラー ---------------- */
const cv=$('c');
const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true,powerPreference:'high-performance'});
const QUAL=['ultra','high','std'].includes(store.get('q','high'))?store.get('q','high'):'high',HQ=QUAL!=='std',ULTRA=QUAL==='ultra';
const PR_MAX=Math.min(devicePixelRatio||1,HQ?2:1.3),PR_MIN=Math.min(PR_MAX,TOUCH?.85:1);let prCur=PR_MAX;
renderer.setPixelRatio(prCur);
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.0;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const ANISO=Math.min(16,renderer.capabilities.getMaxAnisotropy());

const scene=new THREE.Scene();
const HORIZON=new THREE.Color('#cfe6f3');
scene.fog=new THREE.Fog(HORIZON,1200,5600);
const camera=new THREE.PerspectiveCamera(62,1,2,14000);
const SUNDIR=new THREE.Vector3(-0.5,0.78,-0.38).normalize();
function gradientMat(top,hor,ground,sun){return new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,fog:false,
  uniforms:{top:{value:new THREE.Color(top)},hor:{value:new THREE.Color(hor)},gnd:{value:new THREE.Color(ground)},sunDir:{value:SUNDIR},sunK:{value:sun}},
  vertexShader:'varying vec3 vD;void main(){vD=normalize(position);vec4 p=projectionMatrix*modelViewMatrix*vec4(position,1.0);gl_Position=p.xyww;}',
  fragmentShader:'uniform vec3 top;uniform vec3 hor;uniform vec3 gnd;uniform vec3 sunDir;uniform float sunK;varying vec3 vD;void main(){vec3 d=normalize(vD);float h=d.y;vec3 c=h>0.0?mix(hor,top,pow(h,0.5)):mix(hor,gnd,clamp(-h*6.0,0.0,1.0));float s=max(dot(d,sunDir),0.0);c+=vec3(1.0,0.92,0.75)*(pow(s,900.0)*3.0+pow(s,10.0)*0.22)*sunK;gl_FragColor=vec4(c,1.0);\n#include <tonemapping_fragment>\n#include <colorspace_fragment>\n}'});}
{const pm=new THREE.PMREMGenerator(renderer),es=new THREE.Scene();es.add(new THREE.Mesh(new THREE.SphereGeometry(100,32,16),gradientMat('#4a90d9','#e6f2f8','#5b7a44',1)));
  scene.environment=pm.fromScene(es,0.02).texture;scene.environmentIntensity=0.55;pm.dispose();}
const sky=new THREE.Mesh(new THREE.SphereGeometry(5000,32,16),gradientMat('#2c7cd6','#cfe6f3','#cfe6f3',1));
sky.frustumCulled=false;sky.renderOrder=-10;scene.add(sky);
scene.add(new THREE.HemisphereLight('#d4ebff','#56703a',1.25));
const sun=new THREE.DirectionalLight('#fff1d8',2.9);sun.castShadow=true;
const SHR=HQ?150:130,SHM=HQ?2048:1024;sun.shadow.mapSize.set(SHM,SHM);
Object.assign(sun.shadow.camera,{left:-SHR,right:SHR,top:SHR,bottom:-SHR,near:10,far:1400});
sun.shadow.autoUpdate=false;sun.shadow.bias=-0.0006;sun.shadow.normalBias=0.4;scene.add(sun,sun.target);
// 高画質：MSAA＋ブルーム（光るものだけがにじむ）
let composer=null,bloom=null,gtao=null,grade=null;
if(HQ){try{const rt=new THREE.WebGLRenderTarget(4,4,{type:THREE.HalfFloatType,samples:TOUCH?2:4});composer=new EffectComposer(renderer,rt);
  composer.addPass(new RenderPass(scene,camera));
  if(ULTRA&&!/noao/.test(location.search)){gtao=new GTAOPass(scene,camera,innerWidth,innerHeight);gtao.updateGtaoMaterial({radius:3.2,distanceExponent:1.6,thickness:2.5,scale:1.25,samples:12,distanceFallOff:1,screenSpaceRadius:false});
    gtao.updatePdMaterial({lumaPhi:10,depthPhi:2,normalPhi:3,radius:5,radiusExponent:1,rings:2,samples:12});gtao.blendIntensity=1;{const ss=gtao.setSize.bind(gtao);gtao.setSize=(w,h)=>ss(Math.max(1,w>>1),Math.max(1,h>>1));}const ov=gtao.overrideVisibility.bind(gtao);gtao.overrideVisibility=function(){ov();this.scene.traverse(o=>{if((o.isSprite||o===sky)&&o.visible){this._visibilityCache.set(o,true);o.visible=false;}});};composer.addPass(gtao);}
  bloom=new UnrealBloomPass(new THREE.Vector2(256,256),.55,.5,2.4);composer.addPass(bloom);composer.addPass(new OutputPass());
  grade=new ShaderPass({uniforms:{tDiffuse:{value:null},sat:{value:1.1},con:{value:1.05},warm:{value:.025}},vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
    fragmentShader:'uniform sampler2D tDiffuse;uniform float sat,con,warm;varying vec2 vUv;void main(){vec4 c=texture2D(tDiffuse,vUv);vec3 col=c.rgb;float l=dot(col,vec3(.2126,.7152,.0722));col=mix(vec3(l),col,sat);col=(col-.5)*con+.5;col+=vec3(warm,warm*.35,-warm*.8)*(l-.35);gl_FragColor=vec4(clamp(col,0.,1.),1.);}'});composer.addPass(grade);}catch(e){composer=null;}}

/* ---------------- テクスチャ ---------------- */
function ctex(w,h,draw,o={}){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');draw(x,w,h);

  const lim=WALL-6;if(Math.abs(k.lat)>lim){const s=k.lat>0?1:-1,ov=Math.abs(k.lat)-lim;k.x-=NX[bi]*ov*s;k.y-=NY[bi]*ov*s;k.lat=lim*s;k.vel*=.985;k.a+=angDiff(angAt(bi),k.a)*.04;

function updKart(k,dt){
  if(k.remote){netFollow(k);kartFX(k);return;}
  const racing=state!=='select'&&state!=='count';
  const st=k.st;let steer=0,thr=0,brk=0,wantDrift=false,top=MAXV*k.skill*(1+(st.spd-3)*.035),pressItem=false;
  if(k.auto||k.rocket>0){const t=(k.idx+9)%N,off=k.rocket>0?0:k.off,tx=PX[t]+NX[t]*off,ty=PY[t]+NY[t]*off,d=angDiff(Math.atan2(ty-k.y,tx-k.x),k.a);
    steer=clamp(d*3.2,-1,1);thr=1;top*=1-Math.min(.32,Math.abs(d)*.45);
    if(k.auto){if(k!==player&&state==='race'){const df=(k.prog-player.prog)*STEP;if(df>500)top*=.93;else if(df<-500)top*=1.06;}
      if(k.fin)top*=.8;k.offN-=dt;if(k.offN<0){k.offN=rnd(2,5);k.offT=rnd(-28,28);}k.off+=(k.offT-k.off)*Math.min(1,dt*.8);
      if(k.item&&racing){k.itemT-=dt;if(k.itemT<0){pressItem=true;k.itemT=k.item==='gturbo'?.6:rnd(.5,2.5);}}
      if(k.ink>0){steer=clamp(steer+Math.sin(raceT*7+k.ci)*.35,-1,1);top*=.9;}

function netCleanup(){if(!NET)return;const n=NET;NET=null;try{n.sig&&n.sig.close();}catch(_){}clearTimeout(n.timer);if(n.link){n.link.onclose=null;n.link.close();}else if(n.pc){try{n.pc.close();}catch(_){}}}
function netHostStart(retry=0){netCleanup();
  const code=[...Array(4)].map(()=>CODE_CH[Math.floor(Math.random()*CODE_CH.length)]).join('');
  NET={role:'host',code,live:false,peer:null,peerReady:false,ready:true,q:0,rq:-1};const me=NET;
  netPanel('busy','接続サーバーに接続しています…');
  let pc=null,remote=null,pend=[];
  me.sig=sigConnect('tkgp-'+code,{
    open(){if(NET===me)netPanel('hosting',code);},
    error(e){if(NET!==me)return;if(e==='taken'&&retry<3)netHostStart(retry+1);else netFail(e);},
    msg(m){if(NET!==me)return;const p=m.payload||{};
      if(m.type==='OFFER'){if(pc){me.sig.send({type:'ANSWER',payload:{busy:1},dst:m.src});return;}
        remote=m.src;pc=me.pc=new RTCPeerConnection(ICE);
        pc.onicecandidate=e=>{if(e.candidate)me.sig.send({type:'CANDIDATE',payload:{candidate:e.candidate.toJSON()},dst:remote});};
        const ch={};pc.ondatachannel=e=>{ch[e.channel.label]=e.channel;if(ch.r&&ch.u)makeLink(pc,ch.r,ch.u,L=>netConnected(me,L));};
        netPanel('busy','相手が見つかりました。接続しています…');
        pc.setRemoteDescription(p.sdp).then(()=>{pend.forEach(c=>pc.addIceCandidate(c).catch(()=>{}));pend=[];return pc.createAnswer();})
          .then(a=>pc.setLocalDescription(a)).then(()=>me.sig.send({type:'ANSWER',payload:{sdp:descJ(pc.localDescription)},dst:remote})).catch(()=>{if(NET===me)netFail('rtc');});
        me.timer=setTimeout(()=>{if(NET===me&&!me.live)netFail('rtc');},25000);}
      else if(m.type==='CANDIDATE'&&m.src===remote&&p.candidate){if(pc.remoteDescription)pc.addIceCandidate(p.candidate).catch(()=>{});else pend.push(p.candidate);}}});}
function netJoinStart(code){netCleanup();
  NET={role:'guest',code,live:false,peer:null,peerReady:true,ready:false,q:0,rq:-1};const me=NET;
  netPanel('busy',`ルーム ${code} を探しています…`);
  const id='tkgg-'+Math.random().toString(36).slice(2,10),dst='tkgp-'+code;let pc=null,pend=[],answered=false;
  me.sig=sigConnect(id,{
    open(){if(NET!==me)return;pc=me.pc=new RTCPeerConnection(ICE);
      pc.onicecandidate=e=>{if(e.candidate)me.sig.send({type:'CANDIDATE',payload:{candidate:e.candidate.toJSON()},dst});};
      const r=pc.createDataChannel('r'),u=pc.createDataChannel('u',{ordered:false,maxRetransmits:0});
      makeLink(pc,r,u,L=>netConnected(me,L));
      pc.createOffer().then(o=>pc.setLocalDescription(o)).then(()=>me.sig.send({type:'OFFER',payload:{sdp:descJ(pc.localDescription)},dst})).catch(()=>{if(NET===me)netFail('rtc');});
      me.timer=setTimeout(()=>{if(NET===me&&!me.live)netFail(answered?'rtc':'noroom');},answered?25000:12000);},
    error(e){if(NET===me)netFail(e);},
    msg(m){if(NET!==me||m.src!==dst)return;const p=m.payload||{};
      if(m.type==='ANSWER'){if(p.busy){netFail('full');return;}answered=true;netPanel('busy','ルームが見つかりました。接続しています…');clearTimeout(me.timer);me.timer=setTimeout(()=>{if(NET===me&&!me.live)netFail('rtc');},25000);
        pc.setRemoteDescription(p.sdp).then(()=>{pend.forEach(c=>pc.addIceCandidate(c).catch(()=>{}));pend=[];}).catch(()=>{if(NET===me)netFail('rtc');});}
      else if(m.type==='CANDIDATE'&&p.candidate){if(pc&&pc.remoteDescription)pc.addIceCandidate(p.candidate).catch(()=>{});else pend.push(p.candidate);}}});}
function netConnected(me,L){if(NET!==me){L.close();return;}clearTimeout(me.timer);me.link=L;L.onmsg=netMsg;L.onclose=netLost;
  setTimeout(()=>{try{me.sig&&me.sig.close();}catch(_){}me.sig=null;},1500);
  if(me.role==='guest')L.send({t:'hello',v:NET_VER,ch:selChar,kt:selKart,sk:selSkin});}
const netSend=o=>{if(NET&&NET.link)NET.link.send(o);};
function sendSel(){if(online())netSend({t:'sel',ch:selChar,kt:selKart,sk:selSkin,ready:NET.ready});}
function sendCfg(){if(online()&&NET.role==='host')netSend({t:'cfg',co:selCourse,cc});}
addEventListener('pagehide',()=>{if(NET&&NET.link)NET.link.send({t:'bye'});});
function netLeave(){if(!NET)return;if(NET.link)NET.link.send({t:'bye'});const n=NET;setTimeout(()=>{if(n.link){n.link.onclose=null;n.link.close();}},150);NET=null;try{n.sig&&n.sig.close();}catch(_){}clearTimeout(n.timer);
  for(const k of karts){if(k.remote){k.remote=false;k.auto=true;}}show('netInfo',0);}
function netLost(){if(!NET)return;NET=null;
  for(const k of karts){if(k.remote||k.h){k.remote=false;if(k!==player)k.auto=true;k.buf=null;}}
  if(state==='count'||state==='race'||state==='done'){showBanner('通信が切れました（相手はCPUに交代）',2.5);}
  else{toast('相手との接続が切れました',3500);if(state==='select'||state==='result'){toTitle();}else if(!$('net').classList.contains('hide'))netPanel('msg','相手との接続が切れました');}
  show('resWait',0);show('again',1);show('netInfo',0);}
function netSelUI(){const go=$('go'),info=$('netInfo'),lock=NET&&NET.role==='guest';
  document.querySelectorAll('[data-co],[data-cc]').forEach(b=>b.classList.toggle('lock',!!lock));
  if(!NET){go.textContent='レース開始！';go.disabled=false;show('netInfo',0);return;}
  show('netInfo',1);const p=NET.peer,pn=p?CHARS[p.ch].em+' '+CHARS[p.ch].name+'（'+KTYPES[p.kt].name+'）':'—';
  if(NET.role==='host'){go.disabled=!NET.peerReady;go.textContent=NET.peerReady?'レース開始！':'相手の準備待ち…';
    info.innerHTML=`🌐 オンライン（ルーム <b>${NET.code}</b>）<br>あいて：${pn}　${NET.peerReady?'✅ 準備OK':'⏳ 選択中'}`;}
  else{go.disabled=false;go.textContent=NET.ready?'✅ 準備OK（待機中）':'準備OK';
    info.innerHTML=`🌐 オンライン（ルーム <b>${NET.code}</b>）<br>ホスト：${pn}<br>コース・クラスはホストが決めます`;}}
function netMsg(m){if(!NET)return;
  switch(m.t){
    case 'hello':if(NET.role!=='host')return;if(m.v!==NET_VER){NET.link.send({t:'ver'});setTimeout(()=>netFail('ver'),200);return;}
      NET.live=true;NET.peer={ch:m.ch,kt:m.kt,sk:m.sk||0};NET.peerReady=false;NET.link.send({t:'welcome',v:NET_VER,co:selCourse,cc,ch:selChar,kt:selKart});
      toast('相手が参加しました！キャラを選んでください');toSelect();break;
    case 'welcome':if(NET.role!=='guest')return;if(m.v!==NET_VER){netFail('ver');return;}
      NET.live=true;NET.peer={ch:m.ch,kt:m.kt};selCourse=m.co;cc=m.cc;toast('ルームに参加しました！キャラを選んで「準備OK」');toSelect();break;
    case 'ver':netFail('ver');break;
    case 'sel':NET.peer={ch:m.ch,kt:m.kt,sk:m.sk||0};if(NET.role==='host')NET.peerReady=!!m.ready;if(state==='select')netSelUI();break;
    case 'cfg':if(NET.role!=='guest')return;selCourse=m.co;cc=m.cc;if(state==='select')refreshSel(false);break;
    case 'start':if(NET.role!=='guest')return;NET.ready=false;startRace(m.cfg);break;
    case 'bye':netLost();break;
    case 's':{if(m.q<=NET.rq)return;NET.rq=m.q;const now=performance.now();
      for(const a of m.a){const k=karts[a[0]];if(k&&k.remote){(k.buf||(k.buf=[])).push({t:now,s:a});if(k.buf.length>40)k.buf.shift();}}break;}
    case 'use':{const k=karts[m.k];if(k&&state!=='select'&&state!=='title')spawnItem(k,m.it,m.p,m.id);break;}
    case 'rm':removeObj(m.id,true);break;
    case 'box':{const b=boxes[m.i];if(b&&b.t<=0){b.t=3;burst(b.x,b.z,b.y,16,25,[COL.y,COL.w]);}break;}
    case 'orb':{const k=karts[m.k];if(k&&auth(k)&&k.orbit>0)loseOrbit(k);break;}
  }}
const packK=k=>[k.i,+k.x.toFixed(2),+k.y.toFixed(2),+k.z.toFixed(2),+k.a.toFixed(4),Math.round(k.vel),+k.steer.toFixed(2),k.drift,+k.driftT.toFixed(2),k.boost>0?1:0,
  +Math.max(0,k.spin).toFixed(3),+Math.max(0,k.shield).toFixed(1),+Math.max(0,k.rocket).toFixed(1),+Math.max(0,k.small).toFixed(1),k.air?1:0,k.trick?+k.trickT.toFixed(3):-1,
  k.lap,k.idx,k.fin?+k.finT.toFixed(2):-1,Math.max(0,k.orbit),k.gold>0?1:0,Math.round(k.vz),+Math.max(0,k.hop).toFixed(3),k.thr];
let netAcc=0;
function netTick(dt){if(!online()||!(state==='count'||state==='race'||state==='done'||state==='result'))return;netAcc+=dt;if(netAcc<.05)return;netAcc=0;
  NET.link.sendU({t:'s',q:++NET.q,a:karts.filter(k=>!k.remote).map(packK)});}
function netFollow(k){const B=k.buf;if(!B||!B.length)return;const rt=performance.now()-120;
  let ai=-1;for(let i=B.length-1;i>=0;i--)if(B[i].t<=rt){ai=i;break;}
  let s,x,y,z,an,sp,dT,tT,hp;
  if(ai<0){s=B[0].s;x=s[1];y=s[2];z=s[3];an=s[4];sp=s[10];dT=s[8];tT=s[15];hp=s[22];}
  else{const A=B[ai].s,Bn=B[ai+1];s=A;x=A[1];y=A[2];z=A[3];an=A[4];sp=A[10];dT=A[8];tT=A[15];hp=A[22];
    if(Bn){const f=clamp((rt-B[ai].t)/Math.max(1,Bn.t-B[ai].t),0,1),Q=Bn.s;x=lerp(x,Q[1],f);y=lerp(y,Q[2],f);z=lerp(z,Q[3],f);an=an+angDiff(Q[4],an)*f;
      if(Q[10]>0&&sp>0)sp=lerp(sp,Q[10],f);if(Q[15]>=0&&tT>=0)tT=lerp(tT,Q[15],f);if(Q[7]===A[7])dT=lerp(dT,Q[8],f);hp=lerp(hp,Q[22],f);if(f>.5)s=Q;}
    else{const e=clamp((rt-B[ai].t)/1000,0,.25);x+=Math.cos(an)*A[5]*e;y+=Math.sin(an)*A[5]*e;}
    if(ai>1)B.splice(0,ai-1);}
  k.x=x;k.y=y;k.z=z;k.a=an;k.vel=s[5];k.steer=s[6];k.drift=s[7];k.driftT=dT;k.boost=s[9]?.1:0;k.spin=sp;k.shield=s[11];k.rocket=s[12];k.small=s[13];
  k.air=!!s[14];k.trick=tT>=0;k.trickT=Math.max(0,tT);k.lap=s[16];k.idx=nearIdx(s[17],x,y,6);k.fin=s[18]>=0;k.finT=Math.max(0,s[18]);k.orbit=s[19];k.gold=s[20]?1:0;k.vz=s[21];k.hop=hp;k.thr=s[23];
  k.lat=(k.x-PX[k.idx])*NX[k.idx]+(k.y-PY[k.idx])*NY[k.idx];
  if(Math.abs(k.idx-s[17])>N/2)k.lap=s[17]>k.idx?s[16]+1:s[16]-1;
  k.prog=k.lap*N+k.idx;setOrbit(k,k.orbit);}

/* ---------------- リサイズ・ループ ---------------- */
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();
  if(composer){composer.setPixelRatio(renderer.getPixelRatio());composer.setSize(w,h);}
  gCam.aspect=w/h;gCam.setViewOffset(w,h,-w*.2,0,w,h);gCam.updateProjectionMatrix();}
addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,250));resize();
buildCourse(selCourse);resetRace(true);toTitle();$('load').style.display='none';
const NORENDER=/norender/.test(location.search);// テスト用
let last=performance.now();
function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;if(window.__pause){requestAnimationFrame(loop);return;}
  if(state==='select'){if(!NORENDER)renderSel(dt);}else{update(dt);if(!NORENDER)render(dt,t);}netTick(dt);requestAnimationFrame(loop);}
requestAnimationFrame(loop);
window.__kart={get perf(){return {pr:prCur,max:PR_MAX,calls:renderer.info.render.calls,tris:renderer.info.render.triangles,grassOn:grassChunks.filter(g=>g.m.visible).length+'/'+grassChunks.length};},garage(ry,fov){selSpin=false;turn.rotation.y=ry;gCam.fov=fov;gCam.updateProjectionMatrix();},get net(){return NET;},get karts(){return karts;},get state(){return state;},inp,get player(){return player;},step(sec){for(let i=0;i<sec*60;i++)update(1/60);},
  give(it){player.item=it;player.itemN=ITEMS[it].cnt||1;player.roll=0;},use(){useItem(player);},get objs(){return [traps.length,balls.length,homing.length,bombs.length];},cam(){render(0.016,performance.now());},look(x,y,z,tx,ty,tz){window.__pause=1;camera.position.set(x,y,z);camera.lookAt(tx,ty,tz);sky.position.copy(camera.position);if(composer)composer.render();else renderer.render(scene,camera);},
  tp(i,lat=0){const k=player;i=wrapI(i);k.idx=i;k.x=PX[i]+NX[i]*lat;k.y=PY[i]+NY[i]*lat;k.z=H[i];k.a=angAt(i);k.vel=MAXV*.9;k.air=false;k.vz=0;camA=k.a;camPos.set(k.x-Math.cos(k.a)*30,k.z+13,k.y-Math.sin(k.a)*30);},get info(){return {N,TUN,JUMPS,PADS,maxH:Math.max(...H),bf:BF.reduce((a,b)=>a+(b>.5),0),lakes:lakes.map(l=>l.map(Math.round))};}};
