<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#14213d;font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;color:#fff;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.hide{display:none!important}
button{font:inherit;color:#fff;border:0;cursor:pointer}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;text-align:center;padding:2vh 4vw}
.dim{background:radial-gradient(ellipse at center,rgba(10,20,50,.25),rgba(10,20,50,.75))}
h1{margin:0;font-size:min(13vh,10vw);font-style:italic;font-weight:900;letter-spacing:.01em;line-height:.95;text-shadow:0 .6vh 0 #c2261b,0 1.4vh 3vh rgba(0,0,0,.5)}

.btn{min-width:min(24vw,190px);padding:1.6vh 2.4vw;border-radius:1.8vh;font-weight:800;font-size:min(4vh,3.4vw);background:linear-gradient(#3d74f0,#2654c9);box-shadow:0 .7vh 0 #173a8f,0 1vh 2vh rgba(0,0,0,.3)}

.btn.g{background:linear-gradient(#3cc46a,#26a050);box-shadow:0 .7vh 0 #186b34,0 1vh 2vh rgba(0,0,0,.3)}
.btn.y{background:linear-gradient(#f4b73a,#e09412);box-shadow:0 .7vh 0 #8f5e08,0 1vh 2vh rgba(0,0,0,.3)}
.btn.s{min-width:0;font-size:min(2.8vh,2.4vw);padding:1vh 2vw}
.row{display:flex;gap:2vw;flex-wrap:wrap;justify-content:center}
.help{font-size:min(2.5vh,2.2vw);line-height:1.7;opacity:.95;background:rgba(0,0,0,.35);padding:1.1vh 2vw;border-radius:1.4vh}

.r2{display:grid;grid-template-columns:repeat(2,1fr);gap:.8vh}
.opt{background:rgba(255,255,255,.08);border:2px solid transparent;border-radius:1.4vh;padding:.7vh .4vw;font-size:min(2.4vh,1.9vw);font-weight:700;line-height:1.25}

#selInfo{position:fixed;right:calc(3vw + env(safe-area-inset-right));bottom:calc(3vh + env(safe-area-inset-bottom));text-align:right;pointer-events:none}

#selInfo span{font-size:min(2.8vh,2.2vw);opacity:.9}
#hud{position:fixed;inset:0;pointer-events:none;font-style:italic;font-weight:900}
.st{text-shadow:0 0 .5vh rgba(0,0,0,.6),0 .4vh 0 rgba(0,0,0,.55)}
#hRank{position:absolute;left:calc(2.5vw + env(safe-area-inset-left));top:calc(1.5vh + env(safe-area-inset-top));line-height:.9}
#rk{font-size:19vh}#rkS{font-size:6vh;margin-left:.6vh}#rkN{font-size:4vh;opacity:.85}
#hInfo{position:absolute;left:calc(2.5vw + env(safe-area-inset-left));top:calc(22vh + env(safe-area-inset-top));font-size:4.6vh;line-height:1.25}

#hItem{position:absolute;left:50%;top:calc(2vh + env(safe-area-inset-top));transform:translateX(-50%);width:15vh;height:15vh;border-radius:2.6vh;background:rgba(10,18,40,.55);border:.6vh solid rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;font-size:9vh;font-style:normal}
#hItem.has{border-color:#ffd23c;box-shadow:0 0 2vh rgba(255,210,60,.6)}
#itCnt{position:absolute;right:-1.4vh;bottom:-1.4vh;font-size:3.4vh;background:#e2452f;border-radius:2vh;padding:0 1vh;font-style:italic;font-weight:900}

#mini{position:absolute;right:calc(2.5vw + env(safe-area-inset-right));top:calc(2vh + env(safe-area-inset-top));width:30vh;height:30vh}
#dg{position:absolute;left:50%;top:28vh;transform:translateX(-50%);width:24vh;height:1.6vh;background:rgba(0,0,0,.45);border-radius:1vh;overflow:hidden}
#dgf{height:100%;width:0;background:#fff}
#banner{position:absolute;left:0;right:0;top:36vh;text-align:center;font-size:11vh;color:#ffd23c;transition:opacity .3s}
#count{position:absolute;left:0;right:0;top:30vh;text-align:center;font-size:30vh;color:#ffd23c;line-height:1}
#count.pop{animation:pop .9s ease-out}
@keyframes pop{0%{transform:scale(1.6);opacity:0}20%{transform:scale(1);opacity:1}100%{transform:scale(.9);opacity:.85}}
#wrong{position:absolute;left:0;right:0;top:52vh;text-align:center;font-size:8vh;color:#ff5a4a}
#ink{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .6s}
#ink i{position:absolute;border-radius:50%;background:radial-gradient(circle at 40% 40%,#5b2a86 0,#3a1758 55%,rgba(58,23,88,0) 72%)}
#flash{position:fixed;inset:0;pointer-events:none;background:#fff;opacity:0}
#quit{position:fixed;top:calc(2vh + env(safe-area-inset-top));left:calc(50% + 10vh);padding:.8vh 1.6vh;border-radius:1vh;background:rgba(0,0,0,.4);font-size:2.4vh;font-weight:700}
#resL{list-style:none;margin:0;padding:0;font-size:min(3.2vh,2.7vw);min-width:min(64vw,460px);background:rgba(0,0,0,.45);border-radius:1.4vh;overflow:hidden}
#resL li{display:flex;justify-content:space-between;gap:3vw;padding:.5vh 2vw;font-variant-numeric:tabular-nums}
#resL li.me{background:rgba(255,210,60,.35);font-weight:800}
.tb{position:fixed;display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.5);font-weight:800;color:#fff;touch-action:none;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.tb.on{background:rgba(255,255,255,.42)}
#bL,#bR{width:19vh;height:19vh;font-size:8vh;bottom:calc(5vh + env(safe-area-inset-bottom))}
#bL{left:calc(3vw + env(safe-area-inset-left))}
#bR{left:calc(3vw + 22vh + env(safe-area-inset-left))}
#bD{width:22vh;height:22vh;font-size:3.6vh;right:calc(3vw + env(safe-area-inset-right));bottom:calc(5vh + env(safe-area-inset-bottom));background:rgba(60,140,255,.28)}
#bI{width:17vh;height:17vh;font-size:3.4vh;right:calc(3vw + 24vh + env(safe-area-inset-right));bottom:calc(5vh + env(safe-area-inset-bottom));background:rgba(255,190,40,.28)}
#bB{width:13vh;height:13vh;font-size:2.6vh;right:calc(3vw + 4vh + env(safe-area-inset-right));bottom:calc(30vh + env(safe-area-inset-bottom));background:rgba(255,80,60,.28)}

#nCode{font:inherit;font-size:min(4.4vh,3.6vw);font-weight:900;letter-spacing:.3em;text-transform:uppercase;width:min(26vw,210px);text-align:center;padding:1.2vh 1vw;border-radius:1.6vh;border:3px solid #9fc0ff;background:rgba(0,0,0,.35);color:#fff;-webkit-user-select:text;user-select:text}
#nStat b{font-size:min(9vh,7vw);letter-spacing:.2em;color:#ffd23c;display:block;line-height:1.2}
#netInfo{position:fixed;right:calc(3vw + env(safe-area-inset-right));top:calc(3vh + env(safe-area-inset-top));text-align:right;background:rgba(0,0,0,.45);padding:1vh 1.6vw;border-radius:1.4vh;font-size:min(2.6vh,2vw);line-height:1.5;max-width:44vw}
#netInfo b{color:#ffd23c}
.opt.lock{opacity:.55;pointer-events:none}
.btn:disabled{filter:grayscale(.8);opacity:.7}
#toast{position:fixed;left:50%;top:calc(4vh + env(safe-area-inset-top));transform:translateX(-50%);background:rgba(10,18,40,.9);border:2px solid #ffd23c;padding:1.2vh 2.4vw;border-radius:1.6vh;font-weight:800;font-size:min(3vh,2.6vw);z-index:7;text-align:center}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#14213d;font-weight:800;font-size:4vh;z-index:8}
</style>

<body>
<canvas id="c"></canvas>

<div id="title" class="ov dim hide">

    <div class="ttl">クラス</div><div class="r3" id="ccs"></div>
    <div class="row" style="margin-top:.6vh"><button class="btn s" id="back" style="background:#555;box-shadow:0 .5vh 0 #333">もどる</button><button class="btn g" id="go">レース開始！</button></div>
  </div>
  <div id="netInfo" class="hide"></div>
  <div id="selInfo"><b id="selName"></b><span id="selSub"></span></div>
</div>

<div id="ink"></div>
<div id="flash"></div>
<div id="hud" class="hide">
  <div id="hRank" class="st"><span id="rk">8</span><span id="rkS">位</span><span id="rkN">/8</span></div>
  <div id="hInfo" class="st"><div id="hLap">LAP 1/3</div><small id="hTime">0:00.00</small><small id="hSpd">0 km/h</small></div>
  <div id="hItem"><span id="itIcon"></span><span id="itCnt" class="hide"></span><div id="itName" class="st"></div></div>

  <div id="dg" class="hide"><div id="dgf"></div></div>
  <div id="banner" class="st"></div>
  <div id="count" class="st"></div>
  <div id="wrong" class="st hide">逆走！</div>
</div>

<div id="net" class="ov dim hide">
  <h2>🌐 オンライン対戦</h2>
  <div class="help" style="max-width:min(80vw,640px)">2人で対戦します（空いた枠はCPU）。片方が「ルームを作る」を押して、表示された4文字のコードをもう片方に伝えてください。</div>
  <div class="row" id="netBtns">
    <button class="btn g" id="nHost">ルームを作る</button>
    <span class="row" style="gap:1vw"><input id="nCode" maxlength="4" placeholder="コード" autocomplete="off" autocorrect="off" spellcheck="false" autocapitalize="characters"><button class="btn" id="nJoin">参加する</button></span>
  </div>
  <div id="nStat" class="help hide"></div>
  <button class="btn s" id="nBack" style="background:#555;box-shadow:0 .5vh 0 #333">もどる</button>
</div>

<div id="res" class="ov dim hide">
  <h2 id="resT">FINISH!</h2>
  <ol id="resL"></ol>
  <div class="row">
    <button class="btn g" id="again">もう一度</button>
    <button class="btn" id="toSel">キャラ・コース選択</button>
    <button class="btn y" id="toTitle">タイトル</button>
  </div>
  <div id="resWait" class="help hide">ホストが次のレースを始めるのを待っています…</div>
</div>

<div id="touch" class="hide">
  <div class="tb" id="bL">◀</div><div class="tb" id="bR">▶</div>
  <div class="tb" id="bI">アイテム</div><div class="tb" id="bD">ドリフト</div><div class="tb" id="bB">ブレーキ</div>
</div>
<button id="quit" class="hide">✕ やめる</button>
<div id="toast" class="hide"></div>
<div id="rot">📱 スマホを横向きにしてください</div>
<div id="load">読み込み中…</div>

<script type="module">
import * as THREE from './lib/three.module.min.js';
/* ============================================================
   TURBO KART GP  —  three.js で描くオリジナルのカートレース
   ============================================================ */
const $=id=>document.getElementById(id);
const TAU=Math.PI*2,clamp=(v,a,b)=>v<a?a:v>b?b:v,rnd=(a,b)=>a+Math.random()*(b-a),lerp=(a,b,t)=>a+(b-a)*t,sstep=t=>t*t*(3-2*t);
const angDiff=(a,b)=>{let d=(a-b)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return d;};
const TOUCH=('ontouchstart' in window)||navigator.maxTouchPoints>0;
const store={get(k,d){try{const v=localStorage.getItem('tkgp_'+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem('tkgp_'+k,JSON.stringify(v));}catch(e){}}};

/* ---------------- レンダラー ---------------- */
const cv=$('c');
const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,TOUCH?1.75:2));
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.0;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const ANISO=Math.min(16,renderer.capabilities.getMaxAnisotropy());

const scene=new THREE.Scene();
const HORIZON=new THREE.Color('#cfe6f3');
scene.fog=new THREE.Fog(HORIZON,1200,5600);
const camera=new THREE.PerspectiveCamera(62,1,0.5,14000);
const SUNDIR=new THREE.Vector3(-0.5,0.78,-0.38).normalize();
function gradientMat(top,hor,ground,sun){return new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,fog:false,
  uniforms:{top:{value:new THREE.Color(top)},hor:{value:new THREE.Color(hor)},gnd:{value:new THREE.Color(ground)},sunDir:{value:SUNDIR},sunK:{value:sun}},
  vertexShader:'varying vec3 vD;void main(){vD=normalize(position);vec4 p=projectionMatrix*modelViewMatrix*vec4(position,1.0);gl_Position=p.xyww;}',
  fragmentShader:'uniform vec3 top;uniform vec3 hor;uniform vec3 gnd;uniform vec3 sunDir;uniform float sunK;varying vec3 vD;void main(){vec3 d=normalize(vD);float h=d.y;vec3 c=h>0.0?mix(hor,top,pow(h,0.5)):mix(hor,gnd,clamp(-h*6.0,0.0,1.0));float s=max(dot(d,sunDir),0.0);c+=vec3(1.0,0.92,0.75)*(pow(s,900.0)*3.0+pow(s,10.0)*0.22)*sunK;gl_FragColor=vec4(c,1.0);\n#include <tonemapping_fragment>\n#include <colorspace_fragment>\n}'});}
{const pm=new THREE.PMREMGenerator(renderer),es=new THREE.Scene();es.add(new THREE.Mesh(new THREE.SphereGeometry(100,32,16),gradientMat('#4a90d9','#e6f2f8','#5b7a44',1)));
  scene.environment=pm.fromScene(es,0.02).texture;scene.environmentIntensity=0.55;pm.dispose();}
const sky=new THREE.Mesh(new THREE.SphereGeometry(5000,32,16),gradientMat('#2c7cd6','#cfe6f3','#cfe6f3',1));
sky.frustumCulled=false;sky.renderOrder=-10;scene.add(sky);
scene.add(new THREE.HemisphereLight('#d4ebff','#56703a',1.25));
const sun=new THREE.DirectionalLight('#fff1d8',2.9);sun.castShadow=true;
const SHR=TOUCH?130:180;sun.shadow.mapSize.set(TOUCH?1024:2048,TOUCH?1024:2048);
Object.assign(sun.shadow.camera,{left:-SHR,right:SHR,top:SHR,bottom:-SHR,near:10,far:1400});
sun.shadow.bias=-0.0006;sun.shadow.normalBias=0.4;scene.add(sun,sun.target);

/* ---------------- テクスチャ ---------------- */
function ctex(w,h,draw,o={}){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');draw(x,w,h);
  const t=new THREE.CanvasTexture(c);if(o.srgb!==false)t.colorSpace=THREE.SRGBColorSpace;if(o.repeat!==false)t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=ANISO;return t;}
function blot(x,w,h,n,r0,r1,cols,al){for(let i=0;i<n;i++){const cx=Math.random()*w,cy=Math.random()*h,r=rnd(r0,r1),c=cols[i%cols.length];
  for(const ox of[-w,0,w])for(const oy of[-h,0,h]){const g=x.createRadialGradient(cx+ox,cy+oy,0,cx+ox,cy+oy,r);g.addColorStop(0,`rgba(${c},${al})`);g.addColorStop(1,`rgba(${c},0)`);x.fillStyle=g;x.fillRect(cx+ox-r,cy+oy-r,r*2,r*2);}}}
const T={
  grass:ctex(512,512,(x,w,h)=>{x.fillStyle='#5aa43f';x.fillRect(0,0,w,h);blot(x,w,h,70,50,140,['150,205,95','45,120,45','120,180,70'],0.22);}),
  road:ctex(256,512,(x,w,h)=>{x.fillStyle='#5a5d65';x.fillRect(0,0,w,h);blot(x,w,h,40,40,110,['120,122,130','60,62,70'],0.12);
    x.fillStyle='#f2f2f2';x.fillRect(7,0,7,h);x.fillRect(w-14,0,7,h);x.fillStyle='rgba(255,255,255,.75)';x.fillRect(w/2-3,0,6,h/2);}),
  curb:ctex(64,128,(x,w,h)=>{x.fillStyle='#e0362b';x.fillRect(0,0,w,h/2);x.fillStyle='#f6f6f6';x.fillRect(0,h/2,w,h/2);}),
  wall:ctex(64,256,(x,w,h)=>{x.fillStyle='#f2f2f2';x.fillRect(0,0,w,h);x.fillStyle='#2f5fd0';x.fillRect(0,0,w,h/2);x.fillStyle='rgba(0,0,0,.18)';x.fillRect(0,0,6,h);}),
  stone:ctex(256,256,(x,w,h)=>{x.fillStyle='#9a8d7c';x.fillRect(0,0,w,h);blot(x,w,h,40,30,90,['170,160,145','110,100,88'],0.25);}),
  check:ctex(64,256,(x,w,h)=>{const s=32;for(let i=0;i<2;i++)for(let j=0;j<8;j++){x.fillStyle=((i+j)&1)?'#111':'#fafafa';x.fillRect(i*s,j*s,s,s);}}),
  pad:ctex(128,128,(x,w,h)=>{const g=x.createLinearGradient(0,0,w,0);g.addColorStop(0,'#ff6a00');g.addColorStop(.5,'#ffa31a');g.addColorStop(1,'#ff6a00');x.fillStyle=g;x.fillRect(0,0,w,h);
    x.strokeStyle='#fff36b';x.lineWidth=14;x.lineJoin='round';x.lineCap='round';x.beginPath();x.moveTo(24,90);x.lineTo(64,40);x.lineTo(104,90);x.stroke();}),
  ramp:ctex(128,128,(x,w,h)=>{x.fillStyle='#2a63d8';x.fillRect(0,0,w,h);x.fillStyle='#ffd23c';for(let i=-2;i<6;i++){x.beginPath();x.moveTo(i*32,0);x.lineTo(i*32+16,0);x.lineTo(i*32+16+64,h);x.lineTo(i*32+64,h);x.fill();}}),

class Pool{constructor(n,size,blend,opacity){this.n=n;this.i=0;this.p=new Float32Array(n*3);this.c=new Float32Array(n*3);this.v=new Float32Array(n*3);this.l=new Float32Array(n);this.f=new Float32Array(n);
  for(let i=0;i<n;i++)this.p[i*3+1]=-9999;const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(this.p,3));g.setAttribute('color',new THREE.BufferAttribute(this.c,3));

  add(x,y,z,vx,vy,vz,life,col,floor=-1e9){const i=this.i;this.i=(i+1)%this.n;const j=i*3;this.p[j]=x;this.p[j+1]=y;this.p[j+2]=z;this.v[j]=vx;this.v[j+1]=vy;this.v[j+2]=vz;this.l[i]=life;this.f[i]=floor;this.c[j]=col.r;this.c[j+1]=col.g;this.c[j+2]=col.b;}
  update(dt,grav){const p=this.p,v=this.v;for(let i=0;i<this.n;i++){if(this.l[i]<=0)continue;this.l[i]-=dt;const j=i*3;if(this.l[i]<=0){p[j+1]=-9999;continue;}
    p[j]+=v[j]*dt;p[j+1]+=v[j+1]*dt;p[j+2]+=v[j+2]*dt;v[j+1]-=grav*dt;if(p[j+1]<this.f[i]){p[j+1]=this.f[i];v[j+1]=0;}}
    this.g.attributes.position.needsUpdate=true;this.g.attributes.color.needsUpdate=true;}
  clear(){this.l.fill(0);for(let i=0;i<this.n;i++)this.p[i*3+1]=-9999;}}

function trackPos(k){
  const prev=k.idx,bi=nearIdx(k.idx,k.x,k.y,10);k.idx=bi;if(prev>N*.75&&bi<N*.25)k.lap++;else if(prev<N*.25&&bi>N*.75)k.lap--;
  k.lat=(k.x-PX[bi])*NX[bi]+(k.y-PY[bi])*NY[bi];
  const lim=WALL-6;if(Math.abs(k.lat)>lim){const s=k.lat>0?1:-1,ov=Math.abs(k.lat)-lim;k.x-=NX[bi]*ov*s;k.y-=NY[bi]*ov*s;k.lat=lim*s;k.vel*=.985;k.a+=angDiff(angAt(bi),k.a)*.04;
    if(Math.abs(k.vel)>60&&Math.random()<.3)spark.add(k.x+NX[bi]*s*5,k.z+2,k.y+NY[bi]*s*5,rnd(-15,15),rnd(5,15),rnd(-15,15),.3,COL.y);}
  k.prog=k.lap*N+bi;}
function land(k){if(k.trick){k.boost=Math.max(k.boost,.9);burst(k.x,k.z+2,k.y,14,20,[COL.b,COL.w]);if(isMe(k))beep(600,.3,'sawtooth',.07,2);}

function updKart(k,dt){
  if(k.remote){netFollow(k);kartFX(k);return;}
  const racing=state!=='select'&&state!=='count';
  const st=k.st;let steer=0,thr=0,brk=0,wantDrift=false,top=MAXV*k.skill*(1+(st.spd-3)*.035),pressItem=false;
  if(k.auto||k.rocket>0){const t=(k.idx+9)%N,off=k.rocket>0?0:k.off,tx=PX[t]+NX[t]*off,ty=PY[t]+NY[t]*off,d=angDiff(Math.atan2(ty-k.y,tx-k.x),k.a);
    steer=clamp(d*3.2,-1,1);thr=1;top*=1-Math.min(.32,Math.abs(d)*.45);
    if(k.auto){if(k!==player&&state==='race'){const df=(k.prog-player.prog)*STEP;if(df>500)top*=.93;else if(df<-500)top*=1.06;}
      if(k.fin)top*=.8;k.offN-=dt;if(k.offN<0){k.offN=rnd(2,5);k.offT=rnd(-28,28);}k.off+=(k.offT-k.off)*Math.min(1,dt*.8);
      if(k.item&&racing){k.itemT-=dt;if(k.itemT<0){pressItem=true;k.itemT=k.item==='gturbo'?.6:rnd(.5,2.5);}}
      if(k.ink>0){steer=clamp(steer+Math.sin(raceT*7+k.ci)*.35,-1,1);top*=.9;}
      if(k.air&&!k.trick&&Math.random()<dt*4)wantDrift=true;}
    k.steer+=(steer-k.steer)*Math.min(1,dt*10);}
  if(!k.auto){if(k.rocket<=0){k.steer+=((inp.r-inp.l)-k.steer)*Math.min(1,dt*12);steer=k.steer;}thr=(inp.acc||(TOUCH&&!inp.brk))?1:0;brk=k.rocket>0?0:inp.brk;wantDrift=!!inp.drift&&k.rocket<=0;
    if(inp.item&&!k.itemHeld)pressItem=true;k.itemHeld=!!inp.item;if(k.rocket>0)thr=1;}
  if(pressItem&&racing&&k.item)useItem(k);
  if(!racing){thr=0;brk=0;wantDrift=false;}
  if(k.spin>0){k.spin-=dt;k.vel*=Math.pow(.12,dt);thr=0;steer=0;wantDrift=false;}
  const off=Math.abs(k.lat)>ROAD+CURB&&!k.air;
  if(k.rocket>0){k.rocket-=dt;top=MAXV*1.65;k.vel+=420*dt;}
  else if(k.boost>0){k.boost-=dt;top=MAXV*1.42;k.vel+=300*dt;}
  else if(k.shield>0)top*=1.12;else if(off)top*=st.off?.78:.5;
  if(k.shield>0)k.shield-=dt;if(k.small>0){k.small-=dt;top*=.78;}if(k.ink>0)k.ink-=dt;
  if(k.gold>0){k.gold-=dt;if(k.gold<=0&&k.item==='gturbo')k.item=null;}
  const acc=MAXV*(.55+(st.acc-3)*.12);k.thr=thr;
  if(thr&&k.vel<top)k.vel=Math.min(top,k.vel+acc*dt);
  if(k.vel>top)k.vel-=(k.vel-top)*Math.min(1,dt*(off?4:2.2));
  if(!thr&&!brk&&k.vel>0)k.vel=Math.max(0,k.vel-45*dt);
  if(brk){if(k.vel>0)k.vel=Math.max(0,k.vel-240*dt);else k.vel=Math.max(-45,k.vel-90*dt);}else if(k.vel<0)k.vel=Math.min(0,k.vel+120*dt);
  // ドリフト・トリック
  const press=wantDrift&&!k.dHeld;k.dHeld=wantDrift;
  if(k.air){if(press&&!k.trick&&k.airT>.05){k.trick=true;k.trickT=0;if(isMe(k))beep(800,.12,'square',.05,1.5);}}
  else if(press&&k.hop<=0)k.hop=.3;
  if(k.drift){if(!wantDrift||k.vel<MAXV*.3){if(k.driftT>1.7){k.boost=Math.max(k.boost,1.25);if(isMe(k))beep(400,.4,'sawtooth',.08,2.5);}else if(k.driftT>.75){k.boost=Math.max(k.boost,.6);if(isMe(k))beep(350,.25,'sawtooth',.07,2);}k.drift=0;k.driftT=0;}
    else{const b=k.driftT;k.driftT+=dt;if(isMe(k)&&((b<.75&&k.driftT>=.75)||(b<1.7&&k.driftT>=1.7)))beep(b<.75?700:1000,.08,'square',.05);}}

    if(Bn){const f=clamp((rt-B[ai].t)/Math.max(1,Bn.t-B[ai].t),0,1),Q=Bn.s;x=lerp(x,Q[1],f);y=lerp(y,Q[2],f);z=lerp(z,Q[3],f);an=an+angDiff(Q[4],an)*f;
      if(Q[10]>0&&sp>0)sp=lerp(sp,Q[10],f);if(Q[15]>=0&&tT>=0)tT=lerp(tT,Q[15],f);if(Q[7]===A[7])dT=lerp(dT,Q[8],f);hp=lerp(hp,Q[22],f);if(f>.5)s=Q;}
    else{const e=clamp((rt-B[ai].t)/1000,0,.25);x+=Math.cos(an)*A[5]*e;y+=Math.sin(an)*A[5]*e;}
    if(ai>1)B.splice(0,ai-1);}
  k.x=x;k.y=y;k.z=z;k.a=an;k.vel=s[5];k.steer=s[6];k.drift=s[7];k.driftT=dT;k.boost=s[9]?.1:0;k.spin=sp;k.shield=s[11];k.rocket=s[12];k.small=s[13];
  k.air=!!s[14];k.trick=tT>=0;k.trickT=Math.max(0,tT);k.lap=s[16];k.idx=nearIdx(s[17],x,y,6);k.fin=s[18]>=0;k.finT=Math.max(0,s[18]);k.orbit=s[19];k.gold=s[20]?1:0;k.vz=s[21];k.hop=hp;k.thr=s[23];
  k.lat=(k.x-PX[k.idx])*NX[k.idx]+(k.y-PY[k.idx])*NY[k.idx];
  if(Math.abs(k.idx-s[17])>N/2)k.lap=s[17]>k.idx?s[16]+1:s[16]-1;
  k.prog=k.lap*N+k.idx;setOrbit(k,k.orbit);}

addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,250));resize();
buildCourse(selCourse);resetRace(true);toTitle();$('load').style.display='none';

let last=performance.now();
function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;
  if(state==='select'){if(!NORENDER)renderSel(dt);}else{update(dt);if(!NORENDER)render(dt,t);}netTick(dt);requestAnimationFrame(loop);}
requestAnimationFrame(loop);
window.__kart={get net(){return NET;},get karts(){return karts;},get state(){return state;},inp,get player(){return player;},step(sec){for(let i=0;i<sec*60;i++)update(1/60);},
  give(it){player.item=it;player.itemN=ITEMS[it].cnt||1;player.roll=0;},use(){useItem(player);},get objs(){return [traps.length,balls.length,homing.length,bombs.length];},cam(){render(0.016,performance.now());},
  tp(i,lat=0){const k=player;i=wrapI(i);k.idx=i;k.x=PX[i]+NX[i]*lat;k.y=PY[i]+NY[i]*lat;k.z=H[i];k.a=angAt(i);k.vel=MAXV*.9;k.air=false;k.vz=0;camA=k.a;camPos.set(k.x-Math.cos(k.a)*30,k.z+13,k.y-Math.sin(k.a)*30);},get info(){return {N,TUN,JUMPS,PADS,maxH:Math.max(...H),bf:BF.reduce((a,b)=>a+(b>.5),0)};}};
