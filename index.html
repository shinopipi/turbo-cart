<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#14213d;font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;color:#fff;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.hide{display:none!important}
button{font:inherit;color:#fff;border:0;cursor:pointer}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;text-align:center;padding:2vh 4vw}
.dim{background:radial-gradient(ellipse at center,rgba(10,20,50,.25),rgba(10,20,50,.75))}
h1{margin:0;font-size:min(13vh,10vw);font-style:italic;font-weight:900;letter-spacing:.01em;line-height:.95;text-shadow:0 .6vh 0 #c2261b,0 1.4vh 3vh rgba(0,0,0,.5)}
h1 span{color:#ffd23c}
h2{margin:0;font-size:min(7vh,6vw);font-style:italic;font-weight:900;text-shadow:0 .4vh 0 #c2261b,0 1vh 2vh rgba(0,0,0,.4)}
.btn{min-width:min(24vw,190px);padding:1.6vh 2.4vw;border-radius:1.8vh;font-weight:800;font-size:min(4vh,3.4vw);background:linear-gradient(#3d74f0,#2654c9);box-shadow:0 .7vh 0 #173a8f,0 1vh 2vh rgba(0,0,0,.3)}
.btn:active{transform:translateY(.4vh);box-shadow:0 .3vh 0 #173a8f}
.btn.g{background:linear-gradient(#3cc46a,#26a050);box-shadow:0 .7vh 0 #186b34,0 1vh 2vh rgba(0,0,0,.3)}
.btn.y{background:linear-gradient(#f4b73a,#e09412);box-shadow:0 .7vh 0 #8f5e08,0 1vh 2vh rgba(0,0,0,.3)}
.btn.s{min-width:0;font-size:min(2.8vh,2.4vw);padding:1vh 2vw}
.row{display:flex;gap:2vw;flex-wrap:wrap;justify-content:center}
.help{font-size:min(2.5vh,2.2vw);line-height:1.7;opacity:.95;background:rgba(0,0,0,.35);padding:1.1vh 2vw;border-radius:1.4vh}
/* セレクト */
#sel{position:fixed;inset:0;display:flex;justify-content:flex-start;align-items:stretch;padding:calc(2vh + env(safe-area-inset-top)) 2vw calc(2vh + env(safe-area-inset-bottom)) calc(2vw + env(safe-area-inset-left))}
#panel{width:min(50vw,560px);overflow:auto;background:rgba(8,16,40,.72);border:1px solid rgba(255,255,255,.12);border-radius:2vh;padding:1.6vh 1.6vw;display:flex;flex-direction:column;gap:1vh;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.ttl{font-size:min(2.6vh,2vw);font-weight:800;letter-spacing:.1em;color:#9fc0ff}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.8vh}
.r3{display:grid;grid-template-columns:repeat(3,1fr);gap:.8vh}
.opt{background:rgba(255,255,255,.08);border:2px solid transparent;border-radius:1.4vh;padding:.7vh .4vw;font-size:min(2.4vh,1.9vw);font-weight:700;line-height:1.25}
.opt b{display:block;font-size:min(4.4vh,3.4vw);line-height:1.2}
.opt.on{border-color:#ffd23c;background:rgba(255,210,60,.18)}
.stats{display:grid;grid-template-columns:auto 1fr;gap:.5vh 1vw;align-items:center;font-size:min(2.3vh,1.8vw);background:rgba(0,0,0,.25);padding:.8vh 1vw;border-radius:1.2vh}
.bar{height:1.3vh;background:rgba(255,255,255,.12);border-radius:1vh;overflow:hidden}
.bar i{display:block;height:100%;border-radius:1vh;background:linear-gradient(90deg,#4fc3ff,#7cf5a8);transition:width .25s}
#selInfo{position:fixed;right:calc(3vw + env(safe-area-inset-right));bottom:calc(3vh + env(safe-area-inset-bottom));text-align:right;pointer-events:none}
#selInfo b{display:block;font-size:min(7vh,5vw);font-style:italic;font-weight:900;text-shadow:0 .4vh 0 rgba(0,0,0,.4)}
#selInfo span{font-size:min(2.8vh,2.2vw);opacity:.9}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;font-style:italic;font-weight:900}
.st{text-shadow:0 0 .5vh rgba(0,0,0,.6),0 .4vh 0 rgba(0,0,0,.55)}
#hRank{position:absolute;left:calc(2.5vw + env(safe-area-inset-left));top:calc(1.5vh + env(safe-area-inset-top));line-height:.9}
#rk{font-size:19vh}#rkS{font-size:6vh;margin-left:.6vh}#rkN{font-size:4vh;opacity:.85}
#hInfo{position:absolute;left:calc(2.5vw + env(safe-area-inset-left));top:calc(22vh + env(safe-area-inset-top));font-size:4.6vh;line-height:1.25}
#hInfo small{font-size:3.6vh;opacity:.92;display:block}
#hItem{position:absolute;left:50%;top:calc(2vh + env(safe-area-inset-top));transform:translateX(-50%);width:15vh;height:15vh;border-radius:2.6vh;background:rgba(10,18,40,.55);border:.6vh solid rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;font-size:9vh;font-style:normal}
#hItem.has{border-color:#ffd23c;box-shadow:0 0 2vh rgba(255,210,60,.6)}
#itName{position:absolute;top:16vh;left:50%;transform:translateX(-50%);font-size:3.2vh;color:#ffd23c;white-space:nowrap}
#mini{position:absolute;right:calc(2.5vw + env(safe-area-inset-right));top:calc(2vh + env(safe-area-inset-top));width:30vh;height:30vh}
#dg{position:absolute;left:50%;top:28vh;transform:translateX(-50%);width:24vh;height:1.6vh;background:rgba(0,0,0,.45);border-radius:1vh;overflow:hidden}
#dgf{height:100%;width:0;background:#fff}
#banner{position:absolute;left:0;right:0;top:36vh;text-align:center;font-size:11vh;color:#ffd23c;transition:opacity .3s}
#count{position:absolute;left:0;right:0;top:30vh;text-align:center;font-size:30vh;color:#ffd23c;line-height:1}
#count.pop{animation:pop .9s ease-out}
@keyframes pop{0%{transform:scale(1.6);opacity:0}20%{transform:scale(1);opacity:1}100%{transform:scale(.9);opacity:.85}}
#wrong{position:absolute;left:0;right:0;top:52vh;text-align:center;font-size:8vh;color:#ff5a4a}
#quit{position:fixed;top:calc(2vh + env(safe-area-inset-top));left:calc(50% + 10vh);padding:.8vh 1.6vh;border-radius:1vh;background:rgba(0,0,0,.4);font-size:2.4vh;font-weight:700}
/* リザルト */
#resL{list-style:none;margin:0;padding:0;font-size:min(3.2vh,2.7vw);min-width:min(64vw,460px);background:rgba(0,0,0,.45);border-radius:1.4vh;overflow:hidden}
#resL li{display:flex;justify-content:space-between;gap:3vw;padding:.5vh 2vw;font-variant-numeric:tabular-nums}
#resL li.me{background:rgba(255,210,60,.35);font-weight:800}
/* タッチ */
.tb{position:fixed;display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.5);font-weight:800;color:#fff;touch-action:none;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.tb.on{background:rgba(255,255,255,.42)}
#bL,#bR{width:19vh;height:19vh;font-size:8vh;bottom:calc(5vh + env(safe-area-inset-bottom))}
#bL{left:calc(3vw + env(safe-area-inset-left))}
#bR{left:calc(3vw + 22vh + env(safe-area-inset-left))}
#bD{width:22vh;height:22vh;font-size:3.6vh;right:calc(3vw + env(safe-area-inset-right));bottom:calc(5vh + env(safe-area-inset-bottom));background:rgba(60,140,255,.28)}
#bI{width:17vh;height:17vh;font-size:3.4vh;right:calc(3vw + 24vh + env(safe-area-inset-right));bottom:calc(5vh + env(safe-area-inset-bottom));background:rgba(255,190,40,.28)}
#bB{width:13vh;height:13vh;font-size:2.6vh;right:calc(3vw + 4vh + env(safe-area-inset-right));bottom:calc(30vh + env(safe-area-inset-bottom));background:rgba(255,80,60,.28)}
#rot{position:fixed;inset:0;background:#14213d;display:none;align-items:center;justify-content:center;font-size:5vw;font-weight:800;text-align:center;z-index:9}
@media (orientation:portrait) and (pointer:coarse){#rot{display:flex}}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#14213d;font-weight:800;font-size:4vh;z-index:8}

<canvas id="c"></canvas>

<script type="module">
import * as THREE from './lib/three.module.min.js';
/* ============================================================
   TURBO KART GP  —  three.js で描くオリジナルのカートレース
   ============================================================ */
const $=id=>document.getElementById(id);
const TAU=Math.PI*2,clamp=(v,a,b)=>v<a?a:v>b?b:v,rnd=(a,b)=>a+Math.random()*(b-a),lerp=(a,b,t)=>a+(b-a)*t;
const angDiff=(a,b)=>{let d=(a-b)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return d;};
const TOUCH=('ontouchstart' in window)||navigator.maxTouchPoints>0;
const store={get(k,d){try{const v=localStorage.getItem('tkgp_'+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem('tkgp_'+k,JSON.stringify(v));}catch(e){}}};

/* ---------------- レンダラー ---------------- */
const cv=$('c');
const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,TOUCH?1.6:2));
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.0;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const ANISO=Math.min(16,renderer.capabilities.getMaxAnisotropy());

const scene=new THREE.Scene();
const HORIZON=new THREE.Color('#cfe6f3');
scene.fog=new THREE.Fog(HORIZON,900,3400);
const camera=new THREE.PerspectiveCamera(62,1,0.5,12000);
const SUNDIR=new THREE.Vector3(-0.5,0.78,-0.38).normalize();

/* 環境光（PBR反射用） */
function gradientMat(top,hor,ground,sun){return new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,fog:false,
  uniforms:{top:{value:new THREE.Color(top)},hor:{value:new THREE.Color(hor)},gnd:{value:new THREE.Color(ground)},sunDir:{value:SUNDIR},sunK:{value:sun}},
  vertexShader:'varying vec3 vD;void main(){vD=normalize(position);vec4 p=projectionMatrix*modelViewMatrix*vec4(position,1.0);gl_Position=p.xyww;}',
  fragmentShader:'uniform vec3 top;uniform vec3 hor;uniform vec3 gnd;uniform vec3 sunDir;uniform float sunK;varying vec3 vD;void main(){vec3 d=normalize(vD);float h=d.y;vec3 c=h>0.0?mix(hor,top,pow(h,0.5)):mix(hor,gnd,clamp(-h*6.0,0.0,1.0));float s=max(dot(d,sunDir),0.0);c+=vec3(1.0,0.92,0.75)*(pow(s,900.0)*3.0+pow(s,10.0)*0.22)*sunK;gl_FragColor=vec4(c,1.0);\n#include <tonemapping_fragment>\n#include <colorspace_fragment>\n}'});}
{const pm=new THREE.PMREMGenerator(renderer),es=new THREE.Scene();es.add(new THREE.Mesh(new THREE.SphereGeometry(100,32,16),gradientMat('#4a90d9','#e6f2f8','#5b7a44',1)));
  scene.environment=pm.fromScene(es,0.02).texture;scene.environmentIntensity=0.55;pm.dispose();}

const sky=new THREE.Mesh(new THREE.SphereGeometry(5000,32,16),gradientMat('#2c7cd6','#cfe6f3','#cfe6f3',1));
sky.frustumCulled=false;sky.renderOrder=-10;scene.add(sky);

const hemi=new THREE.HemisphereLight('#d4ebff','#56703a',1.25);scene.add(hemi);
const sun=new THREE.DirectionalLight('#fff1d8',2.9);sun.castShadow=true;
const SHR=TOUCH?120:170;sun.shadow.mapSize.set(TOUCH?1024:2048,TOUCH?1024:2048);
Object.assign(sun.shadow.camera,{left:-SHR,right:SHR,top:SHR,bottom:-SHR,near:10,far:1200});
sun.shadow.bias=-0.0006;sun.shadow.normalBias=0.4;scene.add(sun,sun.target);

/* ---------------- テクスチャ ---------------- */
function ctex(w,h,draw,o={}){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');draw(x,w,h);
  const t=new THREE.CanvasTexture(c);if(o.srgb!==false)t.colorSpace=THREE.SRGBColorSpace;if(o.repeat!==false)t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=ANISO;return t;}
function blot(x,w,h,n,r0,r1,cols,al){for(let i=0;i<n;i++){const cx=Math.random()*w,cy=Math.random()*h,r=rnd(r0,r1),c=cols[i%cols.length];
  for(const ox of[-w,0,w])for(const oy of[-h,0,h]){const g=x.createRadialGradient(cx+ox,cy+oy,0,cx+ox,cy+oy,r);g.addColorStop(0,`rgba(${c},${al})`);g.addColorStop(1,`rgba(${c},0)`);x.fillStyle=g;x.fillRect(cx+ox-r,cy+oy-r,r*2,r*2);}}}
const T={
  grass:ctex(512,512,(x,w,h)=>{x.fillStyle='#5aa43f';x.fillRect(0,0,w,h);blot(x,w,h,70,50,140,['150,205,95','45,120,45','120,180,70'],0.22);}),
  road:ctex(256,512,(x,w,h)=>{x.fillStyle='#5a5d65';x.fillRect(0,0,w,h);blot(x,w,h,40,40,110,['120,122,130','60,62,70'],0.12);
    x.fillStyle='#f2f2f2';x.fillRect(7,0,7,h);x.fillRect(w-14,0,7,h);x.fillStyle='rgba(255,255,255,.75)';x.fillRect(w/2-3,0,6,h/2);}),
  curb:ctex(64,128,(x,w,h)=>{x.fillStyle='#e0362b';x.fillRect(0,0,w,h/2);x.fillStyle='#f6f6f6';x.fillRect(0,h/2,w,h/2);}),
  wall:ctex(64,256,(x,w,h)=>{x.fillStyle='#f2f2f2';x.fillRect(0,0,w,h);x.fillStyle='#2f5fd0';x.fillRect(0,0,w,h/2);x.fillStyle='rgba(0,0,0,.18)';x.fillRect(0,0,6,h);}),
  check:ctex(64,256,(x,w,h)=>{const s=32;for(let i=0;i<2;i++)for(let j=0;j<8;j++){x.fillStyle=((i+j)&1)?'#111':'#fafafa';x.fillRect(i*s,j*s,s,s);}}),
  pad:ctex(128,128,(x,w,h)=>{const g=x.createLinearGradient(0,0,w,0);g.addColorStop(0,'#ff6a00');g.addColorStop(.5,'#ffa31a');g.addColorStop(1,'#ff6a00');x.fillStyle=g;x.fillRect(0,0,w,h);
    x.strokeStyle='#fff36b';x.lineWidth=14;x.lineJoin='round';x.lineCap='round';x.beginPath();x.moveTo(24,90);x.lineTo(64,40);x.lineTo(104,90);x.stroke();}),
  star:ctex(128,128,(x,w,h)=>{x.fillStyle='rgba(255,255,255,.25)';x.fillRect(0,0,w,h);x.strokeStyle='#fff';x.lineWidth=10;x.strokeRect(5,5,w-10,h-10);
    x.fillStyle='#fff';x.beginPath();for(let i=0;i<10;i++){const r=i&1?18:42,a=-Math.PI/2+i*Math.PI/5;x.lineTo(64+Math.cos(a)*r,66+Math.sin(a)*r);}x.fill();},{repeat:false}),
  soft:ctex(64,64,(x,w,h)=>{const g=x.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.4,'rgba(255,255,255,.6)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,0,w,h);},{repeat:false}),
  cloud:ctex(256,128,(x,w,h)=>{for(let i=0;i<14;i++){const cx=rnd(50,206),cy=rnd(55,85),r=rnd(25,48),g=x.createRadialGradient(cx,cy,0,cx,cy,r);g.addColorStop(0,'rgba(255,255,255,.95)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(cx-r,cy-r,r*2,r*2);}},{repeat:false}),
  banner:ctex(1024,128,(x,w,h)=>{x.fillStyle='#14213d';x.fillRect(0,0,w,h);for(let i=0;i<64;i++)for(let j=0;j<2;j++){x.fillStyle=((i+j)&1)?'#111':'#fff';x.fillRect(i*16,j*8,16,8);x.fillRect(i*16,h-16+j*8,16,8);}
    x.font='italic 900 72px system-ui,sans-serif';x.textBaseline='middle';const seg=[['TURBO ','#fff'],['KART','#ffd23c'],[' GP','#fff']],tw=seg.reduce((a,s)=>a+x.measureText(s[0]).width,0);let px=(w-tw)/2;for(const[t,c]of seg){x.fillStyle=c;x.fillText(t,px,h/2+2);px+=x.measureText(t).width;}},{repeat:false}),
};
T.road.anisotropy=T.grass.anisotropy=ANISO;

/* ---------------- コース ---------------- */
const S=1.6,ROAD=46,CURB=8,WALL=80,SP=12,LAPS=3;
const CP=[[400,1150],[410,640],[600,360],[930,330],[1150,520],[1200,800],[1400,920],[1620,820],[1800,960],[1790,1250],[1650,1560],[1360,1740],[1060,1680],[990,1420],[830,1330],[700,1460],[640,1700],[430,1700],[380,1440]].map(p=>[p[0]*S,p[1]*S]);
let N,TL,STEP,PX,PY,TX,TY,NX,NY;
(function(){const n=CP.length,d=[];
  for(let i=0;i<n;i++){const p0=CP[(i+n-1)%n],p1=CP[i],p2=CP[(i+1)%n],p3=CP[(i+2)%n];
    for(let s=0;s<32;s++){const t=s/32,t2=t*t,t3=t2*t,f=k=>0.5*(2*p1[k]+(-p0[k]+p2[k])*t+(2*p0[k]-5*p1[k]+4*p2[k]-p3[k])*t2+(-p0[k]+3*p1[k]-3*p2[k]+p3[k])*t3);d.push([f(0),f(1)]);}}
  const cum=[0];for(let i=0;i<d.length;i++){const a=d[i],b=d[(i+1)%d.length];cum.push(cum[i]+Math.hypot(b[0]-a[0],b[1]-a[1]));}
  TL=cum[d.length];N=Math.round(TL/SP);STEP=TL/N;

  if(off&&k.vel>40&&Math.random()<.5)smoke.add(k.x-ca*6+rnd(-3,3),1.5,k.y-sa*6+rnd(-3,3),rnd(-6,6),rnd(4,10),rnd(-6,6),.6,COL.dust);
}

function update(dt){
  if(state==='count'){const b=Math.ceil(countT);countT-=dt;const a=Math.ceil(countT);
    if(a!==b&&a>0&&a<=3){beep(440,.18,'square',.08);showCount(a);}
    if(countT<=0){state='race';beep(880,.5,'square',.09);showCount('GO!');}}
  if(state==='race'||state==='done'||state==='result')raceT+=dt;
  const pl=player.lap;for(const k of karts)updKart(k,dt);
  for(let i=0;i<8;i++)for(let j=i+1;j<8;j++){const a=karts[i],b=karts[j],dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy;
    if(d2<100&&d2>.01){const d=Math.sqrt(d2),p=10-d,ux=dx/d,uy=dy/d,ta=b.mass/(a.mass+b.mass),tb=1-ta;a.x-=ux*p*ta;a.y-=uy*p*ta;b.x+=ux*p*tb;b.y+=uy*p*tb;
      if(a.shield>0&&b.shield<=0)hit(b);else if(b.shield>0&&a.shield<=0)hit(a);else{const m=(a.vel*a.mass+b.vel*b.mass)/(a.mass+b.mass);a.vel+=(m-a.vel)*.3*tb*2;b.vel+=(m-b.vel)*.3*ta*2;}}}
  const ord=karts.slice().sort((a,b)=>(b.fin?1e9-b.finT:b.prog)-(a.fin?1e9-a.finT:a.prog));ord.forEach((k,i)=>k.rank=i+1);
  for(let i=oils.length-1;i>=0;i--){const o=oils[i];o.t+=dt;let gone=o.t>40;
    for(const k of karts){if(k===o.own&&o.t<.8)continue;const dx=k.x-o.x,dy=k.y-o.y;if(dx*dx+dy*dy<70){if(k.shield<=0)hit(k);gone=true;break;}}
    if(gone){o.m.removeFromParent();oils.splice(i,1);}}
  for(let i=missiles.length-1;i>=0;i--){const m=missiles[i];m.life-=dt;m.s+=400*dt/STEP;
    let tg=null,bd=1e9;for(const k of karts){if(k===m.own)continue;let d=k.idx-(m.s%N);if(d<-N/2)d+=N;if(d>N/2)d-=N;if(d>-1&&d<bd){bd=d;tg=k;}}
    if(tg&&bd<40)m.lat+=(tg.lat-m.lat)*Math.min(1,dt*5);
    const s=((m.s%N)+N)%N,i0=s|0,i1=(i0+1)%N,f=s-i0;m.x=PX[i0]+(PX[i1]-PX[i0])*f+NX[i0]*m.lat;m.y=PY[i0]+(PY[i1]-PY[i0])*f+NY[i0]*m.lat;
    m.m.position.set(m.x,4+Math.sin(raceT*20)*.3,m.y);m.m.rotation.y=-angAt(i0);
    smoke.add(m.x-TX[i0]*4,4,m.y-TY[i0]*4,rnd(-3,3),rnd(1,4),rnd(-3,3),.5,COL.gray);spark.add(m.x-TX[i0]*4,4,m.y-TY[i0]*4,0,0,0,.12,COL.o);
    let gone=m.life<=0;for(const k of karts){if(k===m.own)continue;const dx=k.x-m.x,dy=k.y-m.y;if(dx*dx+dy*dy<130){hit(k);gone=true;break;}}
    if(gone){m.m.removeFromParent();missiles.splice(i,1);}}
  for(const b of boxes)if(b.t>0)b.t-=dt;
  spark.update(dt,40);smoke.update(dt,-6);
  if(state==='race'){
    if(player.lap>pl&&player.lap>1&&player.lap<=LAPS){showBanner(player.lap===LAPS?'ファイナルラップ！':'LAP '+player.lap,1.8);beep(660,.15,'square',.07);setTimeout(()=>beep(880,.25,'square',.07),160);}
    if(player.fin){state='done';doneT=2.8;player.auto=true;player.skill=.9;showBanner('FINISH!',2.6);[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.25,'square',.07),i*130));}
  }else if(state==='done'){doneT-=dt;if(doneT<=0)showResult();}
  if(bannerT>0){bannerT-=dt;if(bannerT<=0)$('banner').style.opacity=0;}
  if(engG&&AC){const on=sndOn&&(state==='race'||state==='count'||state==='done');engG.gain.value=on?.03:0;eng.frequency.value=55+Math.abs(player.vel)*.6+(player.boost>0?40:0);}
}

/* ---------------- 描画 ---------------- */
let camA=0;const camPos=new THREE.Vector3(),camLook=new THREE.Vector3(),tmpV=new THREE.Vector3();let fov=62;
function syncKart(k,dt,t){const v=k.v,hz=k.hop>0?Math.sin(k.hop/.3*Math.PI)*2.6:0;
  v.root.position.set(k.x,hz,k.y);v.root.rotation.y=-(k.a+k.drift*.4+(k.spin>0?k.spin*13:0));
  const sf=clamp(Math.abs(k.vel)/MAXV,0,1);
  v.body.rotation.x=lerp(v.body.rotation.x,-(k.drift?k.drift*.09:k.steer*.06)*sf,Math.min(1,dt*8));
  v.body.rotation.z=lerp(v.body.rotation.z,(k.thr&&k.vel<MAXV*.6?.035:0)+(k.boost>0?.04:0),Math.min(1,dt*5));
  v.body.position.y=Math.sin(t*.025+k.ci)*.06*sf;
  for(const w of v.wheels){w.spin.rotation.z-=k.vel*dt/w.r;if(w.front)w.piv.rotation.y=-k.steer*.42;}
  v.shield.visible=k.shield>0;if(k.shield>0){v.shield.material.color.setHSL((t/1500+k.ci*.1)%1,.9,.6);v.shield.scale.setScalar(1+Math.sin(t/90)*.03);}}
function render(dt,t){
  for(const k of karts)syncKart(k,dt,t);
  for(const b of boxes){b.m.visible=b.t<=0;if(b.m.visible){b.m.rotation.set(t/900+b.ph,t/700+b.ph,0);b.m.position.y=6+Math.sin(t/300+b.ph)*.8;}}
  boxMat.emissive.setHSL((t/2500)%1,.85,.55);boxMat.color.setHSL((t/2500)%1,.8,.7);
  T.pad.offset.y=-(t/400)%1;
  // カメラ
  const p=player;camA+=angDiff(p.a+(p.drift?p.drift*.18:0),camA)*Math.min(1,dt*(state==='title'?3:5));
  let orbit=0;if(state==='count'){const f=clamp((countT-.8)/2.8,0,1);orbit=Math.PI*(f*f*(3-2*f));}
  const ca=Math.cos(camA+orbit),sa=Math.sin(camA+orbit),D=state==='count'?lerp(30,40,orbit/Math.PI):30;
  tmpV.set(p.x-ca*D,12.5+(state==='count'?orbit*2:0),p.y-sa*D);camPos.lerp(tmpV,Math.min(1,dt*(state==='count'?20:9)));
  camera.position.copy(camPos);if(p.shake>0){p.shake-=dt;camera.position.x+=rnd(-1,1)*p.shake*3;camera.position.y+=rnd(-1,1)*p.shake*2;}
  camLook.set(p.x+Math.cos(camA)*12,5,p.y+Math.sin(camA)*12);camera.lookAt(camLook);
  const tf=p.boost>0?74:62;fov+=(tf-fov)*Math.min(1,dt*4);camera.fov=fov;camera.updateProjectionMatrix();
  sky.position.copy(camera.position);
  tmpV.set(p.x+Math.cos(p.a)*50,0,p.y+Math.sin(p.a)*50);sun.target.position.copy(tmpV);sun.position.copy(tmpV).addScaledVector(SUNDIR,600);
  renderer.render(scene,camera);
  if(state==='count'||state==='race'||state==='done')drawHUD(t);
}

/* ---------------- HUD ---------------- */
const mini=$('mini'),mg=mini.getContext('2d'),mmImg=document.createElement('canvas');mmImg.width=mmImg.height=240;
const mmS=200/Math.max(maxX-minX,maxY-minY),mmX=x=>120+(x-CX)*mmS,mmY=y=>120+(y-CY)*mmS;
{const x=mmImg.getContext('2d');x.lineJoin='round';const p=()=>{x.beginPath();x.moveTo(mmX(PX[0]),mmY(PY[0]));for(let i=1;i<N;i++)x.lineTo(mmX(PX[i]),mmY(PY[i]));x.closePath();};
  p();x.strokeStyle='rgba(0,0,0,.5)';x.lineWidth=16;x.stroke();p();x.strokeStyle='#fff';x.lineWidth=8;x.stroke();
  x.save();x.translate(mmX(PX[0]),mmY(PY[0]));x.rotate(angAt(0));x.fillStyle='#e33';x.fillRect(-2,-8,4,16);x.restore();}
const fmt=s=>{const m=Math.floor(s/60);s-=m*60;return m+':'+(s<10?'0':'')+s.toFixed(2);};
const hudC={};const setT=(id,v)=>{if(hudC[id]!==v){hudC[id]=v;$(id).textContent=v;}};
function drawHUD(t){const p=player;
  setT('rk',p.rank+'');if(hudC.rkc!==p.rank){hudC.rkc=p.rank;$('rk').style.color=$('rkS').style.color=['#ffd23c','#e3e6ee','#e8a066'][p.rank-1]||'#fff';}
  setT('hLap','LAP '+clamp(p.lap,1,LAPS)+'/'+LAPS);setT('hTime',fmt(p.fin?p.finT:raceT));setT('hSpd',Math.round(Math.abs(p.vel)*.5)+' km/h');
  let ic='';if(p.roll>0){const ks=Object.keys(ICON);ic=ICON[ks[Math.floor(t/70)%ks.length]];}else if(p.item)ic=ICON[p.item];
  setT('itIcon',ic);setT('itName',p.item&&p.roll<=0?INAME[p.item]:'');$('hItem').classList.toggle('has',!!p.item&&p.roll<=0);
  $('dg').classList.toggle('hide',!p.drift);if(p.drift){const f=clamp(p.driftT/1.7,0,1),d=$('dgf');d.style.width=(f*100)+'%';d.style.background=p.driftT>1.7?'#ff9a2e':p.driftT>.75?'#4fc3ff':'#fff';}
  const wrong=state==='race'&&!p.spin&&Math.abs(angDiff(p.a,angAt(p.idx)))>2.2&&p.vel>20&&Math.floor(t/300)%2;$('wrong').classList.toggle('hide',!wrong);
  mg.clearRect(0,0,240,240);mg.drawImage(mmImg,0,0);
  for(const k of karts){if(k===p)continue;mg.fillStyle=k.css;mg.strokeStyle='#000';mg.lineWidth=1.5;mg.beginPath();mg.arc(mmX(k.x),mmY(k.y),6,0,TAU);mg.fill();mg.stroke();}
  mg.fillStyle='#fff';mg.strokeStyle='#e33';mg.lineWidth=3.5;mg.beginPath();mg.arc(mmX(p.x),mmY(p.y),8,0,TAU);mg.fill();mg.stroke();}
function showBanner(s,d){const b=$('banner');b.textContent=s;b.style.opacity=1;bannerT=d;}
function showCount(s){const c=$('count');c.textContent=s;c.classList.remove('pop');void c.offsetWidth;c.classList.add('pop');setTimeout(()=>{if(c.textContent===s&&s==='GO!')c.textContent='';},900);}

/* ---------------- キャラ選択（ガレージ） ---------------- */
const gScene=new THREE.Scene();
gScene.background=ctex(512,512,(x,w,h)=>{const g=x.createRadialGradient(w*.68,h*.45,10,w*.6,h*.5,w*.75);g.addColorStop(0,'#3b5fae');g.addColorStop(.6,'#1b2c5c');g.addColorStop(1,'#0c1430');x.fillStyle=g;x.fillRect(0,0,w,h);},{repeat:false});
gScene.environment=scene.environment;gScene.environmentIntensity=.7;
gScene.add(new THREE.HemisphereLight('#cfe0ff','#2a3350',1.3));
const gSun=new THREE.DirectionalLight('#ffffff',2.6);gSun.position.set(20,40,25);gSun.castShadow=true;Object.assign(gSun.shadow.camera,{left:-25,right:25,top:25,bottom:-25,near:1,far:120});gSun.shadow.mapSize.set(1024,1024);gSun.shadow.bias=-.0005;gScene.add(gSun);
const gRim=new THREE.DirectionalLight('#7fb4ff',1.6);gRim.position.set(-30,15,-20);gScene.add(gRim);
const turn=new THREE.Group();gScene.add(turn);
{const d=new THREE.Mesh(new THREE.CylinderGeometry(17,18,1.6,64),new THREE.MeshStandardMaterial({color:'#2b3f73',roughness:.35,metalness:.4}));d.position.y=-.8;d.receiveShadow=true;turn.add(d);
  const r=new THREE.Mesh(new THREE.TorusGeometry(17.4,.35,8,96),new THREE.MeshBasicMaterial({color:'#ffd23c',toneMapped:false}));r.rotation.x=Math.PI/2;turn.add(r);}
const gCam=new THREE.PerspectiveCamera(30,1,1,500);gCam.position.set(52,23,44);gCam.lookAt(0,6.5,0);
let preview=null;
function setPreview(){if(preview)disposeKart(preview);preview=buildKart(selChar,selKart);turn.add(preview.root);preview.root.position.y=0;}
function buildSel(){
  $('chars').innerHTML=CHARS.map((c,i)=>`<button class="opt" data-c="${i}"><b>${c.em}</b>${c.name}</button>`).join('');
  $('karts').innerHTML=KTYPES.map((k,i)=>`<button class="opt" data-k="${i}">${k.name}</button>`).join('');
  $('ccs').innerHTML=CLASSES.map((c,i)=>`<button class="opt" data-cc="${i}">${c.name}<br><small>${['やさしい','ふつう','むずかしい'][i]}</small></button>`).join('');
  document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{selChar=+b.dataset.c;store.set('ch',selChar);refreshSel(true);beep(660,.06,'square',.05);});
  document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{selKart=+b.dataset.k;store.set('kt',selKart);refreshSel(true);beep(520,.06,'square',.05);});
  document.querySelectorAll('[data-cc]').forEach(b=>b.onclick=()=>{cc=+b.dataset.cc;store.set('cc',cc);refreshSel(false);beep(440,.06,'square',.05);});}
function refreshSel(model){
  document.querySelectorAll('[data-c]').forEach(b=>b.classList.toggle('on',+b.dataset.c===selChar));
  document.querySelectorAll('[data-k]').forEach(b=>b.classList.toggle('on',+b.dataset.k===selKart));
  document.querySelectorAll('[data-cc]').forEach(b=>b.classList.toggle('on',+b.dataset.cc===cc));
  const s=stats(selChar,selKart);
  $('stats').innerHTML=[['スピード','spd'],['加速','acc'],['ハンドリング','hnd'],['重さ','wgt']].map(([n,k])=>`<span>${n}</span><div class="bar"><i style="width:${s[k]*20}%"></i></div>`).join('');
  $('selName').textContent=CHARS[selChar].em+' '+CHARS[selChar].name;$('selSub').textContent=CLS[CHARS[selChar].cls].n+'　/　'+KTYPES[selKart].name+'：'+KTYPES[selKart].d;
  if(model)setPreview();}
function renderSel(dt){turn.rotation.y+=dt*.6;renderer.render(gScene,gCam);}

/* ---------------- 画面遷移 ---------------- */
const show=(id,on)=>$(id).classList.toggle('hide',!on);
function toTitle(){state='title';resetRace(true);show('title',1);show('sel',0);show('res',0);show('hud',0);show('touch',0);show('quit',0);}
function toSelect(){state='select';show('title',0);show('res',0);show('hud',0);show('touch',0);show('quit',0);show('sel',1);refreshSel(true);}
function startRace(){MAXV=CLASSES[cc].v;initAudio();if(AC&&AC.state==='suspended')AC.resume();
  resetRace(false);state='count';countT=3.8;bannerT=0;$('banner').style.opacity=0;$('count').textContent='';for(const k in hudC)delete hudC[k];
  show('sel',0);show('res',0);show('title',0);show('hud',1);show('quit',1);show('touch',TOUCH);}
function showResult(){state='result';
  const ord=karts.slice().sort((a,b)=>a.rank-b.rank);
  $('resT').textContent=player.rank===1?'🏆 優勝！':player.rank+'位でゴール！';
  $('resL').innerHTML=ord.map(k=>`<li class="${k===player?'me':''}"><span>${k.rank}位　${k.ch.em} ${k.name}${k===player?'（あなた）':''}</span><span>${k.fin?fmt(k.finT):'--:--'}</span></li>`).join('');
  show('res',1);show('touch',0);show('quit',0);show('hud',0);}
$('play').onclick=()=>{initAudio();toSelect();};
$('back').onclick=toTitle;$('go').onclick=startRace;$('again').onclick=startRace;$('toSel').onclick=toSelect;$('toTitle').onclick=toTitle;$('quit').onclick=toTitle;
const sndLabel=()=>$('snd').textContent=sndOn?'🔊 サウンド ON':'🔇 サウンド OFF';sndLabel();
$('snd').onclick=()=>{sndOn=!sndOn;store.set('snd',sndOn);sndLabel();};
$('help').innerHTML=TOUCH
  ?'アクセルは自動 ／ ◀ ▶ でハンドル ／ <b>ドリフト</b>を押しながら曲がり、離すとミニターボ<br>★ボックスでアイテム → <b>アイテム</b>ボタンで使用 ／ オレンジのパネルで加速'
  :'↑/W アクセル　↓/S ブレーキ　←→/AD ハンドル　<b>Space</b> ドリフト（離すとミニターボ）<br><b>Shift / X</b> アイテム　Esc タイトルへ ／ ★ボックスでアイテム、オレンジのパネルで加速';
buildSel();

/* ---------------- リサイズ・ループ ---------------- */
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();
  gCam.aspect=w/h;gCam.setViewOffset(w,h,-w*.2,0,w,h);gCam.updateProjectionMatrix();}
addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,250));resize();
resetRace(true);toTitle();$('load').remove();
let last=performance.now();
function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;
  if(state==='select')renderSel(dt);else{update(dt);render(dt,t);}requestAnimationFrame(loop);}
requestAnimationFrame(loop);
window.__kart={get karts(){return karts;},get state(){return state;},inp,get player(){return player;},step(sec){for(let i=0;i<sec*60;i++)update(1/60);}};
</script>
